name: Sync fork

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork with upstream
        run: gh repo sync jsjhshs/tvbox1 -b main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}